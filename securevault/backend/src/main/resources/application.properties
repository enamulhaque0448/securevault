spring.application.name=securevault

# Reads from environment variables in production (Render), falls back to
# your local XAMPP setup when those env vars aren't set - so this one file
# works both on your PC and when deployed, no separate "prod" file needed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/securevault?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:KS1UTtlVlK8GCcGReu8uAGNRHfVnYftLQyQM3zg5CwQ=}
app.jwt.expiration-ms=3600000

server.port=${PORT:8080}
